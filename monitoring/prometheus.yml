# One-second scrapes: per-process CPU and memory (process-exporter), the demo server's request counter, and the
# number of statements Postgres has run (pg_exporter.py).
global:
  scrape_interval: 1s
  scrape_timeout: 900ms
scrape_configs:
  - job_name: processes
    static_configs:
      - targets: ["127.0.0.1:9256"]
  - job_name: requests
    static_configs:
      - targets: ["127.0.0.1:9257"]
  - job_name: postgres
    static_configs:
      - targets: ["127.0.0.1:9258"]
